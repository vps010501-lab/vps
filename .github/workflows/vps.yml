name: Continuous VPS with SSH & Tailscale

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # كل 6 ساعات

permissions:
  contents: read

concurrency:
  group: persistent-vps
  cancel-in-progress: true

jobs:
  vps-session:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast if Tailscale key missing
        if: ${{ secrets.TAILSCALE_AUTH_KEY == '' }}
        run: |
          echo "❌ Missing secret TAILSCALE_AUTH_KEY. Add it in: Settings → Secrets → Actions."
          exit 1

      - name: System prep (packages, hostname)
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            openssh-server jq curl unzip zip sudo net-tools neofetch ufw

          # Hostname نظيف بدون رموز
          sudo hostnamectl set-hostname vps-${{ github.run_id }}
          if ! grep -q "vps-${{ github.run_id }}" /etc/hosts; then
            echo "127.0.0.1 vps-${{ github.run_id }}" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Configure & start SSH (root login)
        run: |
          set -eux
          sudo mkdir -p /run/sshd

          # تفعيل root login وكلمة المرور
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?ChallengeResponseAuthentication .*/ChallengeResponseAuthentication no/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?UsePAM .*/UsePAM yes/g' /etc/ssh/sshd_config
          if ! grep -q '^ListenAddress 0.0.0.0' /etc/ssh/sshd_config; then
            echo 'ListenAddress 0.0.0.0' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          fi

          # باسورد الروت (سيُخفى في اللوج)
          echo "::add-mask::Tarboo1942003Mm*"
          echo "root:Tarboo1942003Mm*" | sudo chpasswd

          # فتح جدار الحماية لـ SSH (إن وجد ufw)
          sudo ufw --force reset || true
          sudo ufw allow 22/tcp || true
          sudo ufw --force enable || true

          sudo systemctl enable ssh || true
          sudo systemctl restart ssh || sudo service ssh restart || true
          echo "✅ SSH enabled for user root"

      - name: Install & Link Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -eux
          # تثبيت tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # الربط باستخدام الـ Secret فقط
          # نستخدم sudo -E حتى يمر TS_AUTHKEY للـ tailscale
          sudo -E tailscale up \
            --hostname=vps-${{ github.run_id }}

          # الحصول على IP (IPv4) من Tailscale
          tsIP="$(tailscale ip -4 | head -n 1 || true)"
          echo "TAILSCALE_IP=${tsIP}" >> "$GITHUB_ENV"
          echo "::add-mask::${tsIP}"
          echo "✅ Tailscale IP: ${tsIP}"

      - name: Show access info
        run: |
          set -eux
          echo "-------------------------------"
          echo " Hostname  : vps-${{ github.run_id }}"
          echo " SSH (root): password 'Tarboo1942003Mm*'"
          echo " Public IP : (runner's ephemeral; use Tailscale IP below)"
          echo " TS IP     : $TAILSCALE_IP"
          echo "-------------------------------"
          echo "Tip: Connect over Tailscale SSH or regular SSH via the TS IP if routes allow."

      - name: Keep alive (6h loop)
        run: |
          echo "⏳ Keeping the VPS session alive..."
          for i in $(seq 1 360); do  # ~360 دقيقة
            echo "tick $i - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            sleep 60
          done
          echo "✅ Done."
