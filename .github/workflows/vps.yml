name: Continuous Persistent VPS (Pro)

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-vps
  cancel-in-progress: true

jobs:
  vps:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    # اضبط الإعدادات العامة هنا
    env:
      VPS_HOSTNAME: "vps-${{ github.run_id }}"   # اسم المضيف على Tailscale و النظام
      ENABLE_TMATE: "0"                          # 1 لتفعيل جلسة tmate الإختيارية
      KEEPALIVE_MINUTES: "360"                   # مدة التشغيل (دقائق)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # فحص وجود الأسرار الأساسية
      - name: Validate required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.ROOT_PASSWORD }}" ]; then
            echo "::error title=Missing Secret::ROOT_PASSWORD is required to enable SSH root login."
            missing=1
          fi
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "::error title=Missing Secret::TAILSCALE_AUTH_KEY is required to link Tailscale."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: System prepare (packages & tools)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            openssh-server jq curl unzip zip sudo net-tools neofetch tmate ca-certificates
          sudo mkdir -p /run/sshd

      - name: Set hostname cleanly
        run: |
          set -eux
          sudo hostnamectl set-hostname "${VPS_HOSTNAME}"
          # اربط hostname باسم محلي في /etc/hosts
          if ! grep -q "${VPS_HOSTNAME}" /etc/hosts; then
            echo "127.0.0.1 ${VPS_HOSTNAME}" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Configure SSH (root login with password)
        run: |
          set -eux
          # تفعيل/تهيئة إعدادات SSH
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?ChallengeResponseAuthentication .*/ChallengeResponseAuthentication no/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?UsePAM .*/UsePAM yes/g' /etc/ssh/sshd_config
          if ! grep -q '^ListenAddress 0.0.0.0' /etc/ssh/sshd_config; then
            echo 'ListenAddress 0.0.0.0' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          fi

          # تعيين كلمة مرور root من السر (مع إخفائها في اللوج)
          echo "::add-mask::${{ secrets.ROOT_PASSWORD }}"
          echo "root:${{ secrets.ROOT_PASSWORD }}" | sudo chpasswd

          # بدء خدمة SSH
          sudo systemctl enable ssh || true
          sudo systemctl restart ssh || sudo service ssh restart || true

          echo "✅ SSH enabled for user 'root'"

      # --- ربط Tailscale بالطريقة التي طلبتها ---
      - name: Install & Link Tailscale
        run: |
          set -eux
          curl -fsSL https://tailscale.com/install.sh | sh
          # نفس أسلوبك: authkey من Secrets و hostname من run_id
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=${VPS_HOSTNAME}
          tsIP=$(tailscale ip -4 | head -n 1 || true)
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV
          echo "✅ Tailscale IP: $tsIP"

      # (اختياري) جلسة tmate للتصحيح أو الوصول المباشر عبر متصفح/SSH
      - name: Start tmate session (optional)
        if: ${{ env.ENABLE_TMATE == '1' }}
        run: |
          set -eux
          echo "⏳ Starting tmate..."
          tmate -F || true

      # عرض معلومات الاتصال
      - name: Show access info
        run: |
          echo "================ Connection Info ================"
          echo "Tailscale IPv4 : ${TAILSCALE_IP:-N/A}"
          echo "SSH (root)     : ssh root@${TAILSCALE_IP:-<wait for IP>}"
          echo "Hostname       : ${VPS_HOSTNAME}"
          echo "=================================================="

      # إبقاء الجلسة حية
      - name: Keep VPS Alive
        run: |
          mins=${KEEPALIVE_MINUTES}
          echo "⏳ Keeping session alive for $mins minutes..."
          # حلقة خفيفة الوزن
          for i in $(seq 1 "$mins"); do
            echo "tick $i/$mins"; sleep 60
          done
          echo "✅ Done."

      # نسخ احتياطي خفيف للحالة (اختياري)
      - name: Backup tailscale state (zip)
        run: |
          set -eux
          sudo mkdir -p /opt/vps-backup/data
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo cp /var/lib/tailscale/tailscaled.state /opt/vps-backup/data/tailscaled.state || true
          fi
          sudo zip -r -q ./backup.zip /opt/vps-backup || true

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-backup
          path: ./backup.zip
          if-no-files-found: ignore
